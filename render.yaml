services:
  - type: web
    name: hrsc-process-mining
    runtime: python
    rootDir: process-mining
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "false"
    healthCheckPath: /
    autoDeploy: true
